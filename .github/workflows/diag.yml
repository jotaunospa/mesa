name: Diagnóstico

on:
  push:
    branches: [main]
    paths: ["diag/**", "lib/noticias.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEC_CONTACTO: ${{ secrets.SEC_CONTACTO }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python diag/sec_check.py | tee resumen.txt
      - name: Guardar en rama diag
        if: always()
        run: |
          mkdir -p /tmp/o && cp resumen.txt velas_hoy.json resultados/*.json /tmp/o/ 2>/dev/null || true
          git config user.name mesa-bot; git config user.email mesa-bot@users.noreply.github.com
          git checkout --orphan diag-out && git rm -rf -q . && rm -rf diag lib .github captura *.py requirements.txt
          cp -r /tmp/o/. . && date -u > RUN.txt && git add -A && git commit -qm diag && git push -f origin diag-out
