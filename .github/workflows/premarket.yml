name: Premarket (solo recolección)

# Fotos de premarket cada 10 min de 07:00 a 09:28 NY. No toca el Escáner ni la Mesa.
# Lo dispara la tarea programada "Escáner Mesa: premarket" (el cron de GitHub llega tarde).
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "ventana | una_vez | prueba"
        default: "prueba"
      sesion:
        description: "pre (premarket) | post (after-hours)"
        default: "pre"

permissions:
  contents: write

concurrency:
  group: extendido-${{ inputs.sesion || 'pre' }}
  cancel-in-progress: false

jobs:
  premarket:
    runs-on: ubuntu-latest
    timeout-minutes: 260
    env:
      GH_TOKEN: ${{ github.token }}
      DATOS: ${{ github.workspace }}/datos
      SESION: ${{ inputs.sesion || 'pre' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Prueba (no publica)
        if: inputs.modo == 'prueba'
        run: DATOS=/tmp/prueba python premarket.py una_vez
      - name: Recolección
        if: inputs.modo != 'prueba'
        run: |
          .github/actions-datos.sh
          python premarket.py ${{ inputs.modo }}
