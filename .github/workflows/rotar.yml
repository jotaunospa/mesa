name: Rotar datos (30 días de mercado)

# Sábado 08:17 de Nueva York (13:17 UTC en invierno): deja en la rama datos los últimos 30 días de mercado
# y sube lo anterior, un archivo por día, al Release "datos-AAAA-MM" (analisis/archivo.py).
# Corre con el mercado cerrado: nadie más escribe en datos a esa hora.
on:
  schedule:
    - cron: "17 13 * * 6"
  workflow_dispatch:
    inputs:
      dias:
        description: "Días de mercado que quedan en datos"
        default: "30"
      probar:
        description: "1 = solo decir qué rotaría"
        default: ""

concurrency:
  group: datos-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rotar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      DATOS: ${{ github.workspace }}/datos
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: .github/actions-datos.sh
      - name: Rotar
        run: |
          python analisis/archivo.py rotar "$DATOS" --dias "${{ inputs.dias || '30' }}" ${{ inputs.probar && '--probar' || '' }} | tee rotacion.json
      - name: Índice y push
        if: ${{ !inputs.probar }}
        run: |
          python -c "import screener as s; s.escribir_indice(); s.publicar('rotación - días viejos a Releases')"
