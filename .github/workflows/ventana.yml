name: Ventana (fotos del screener)

# Fotos cada 3 min entre 09:31 y 10:20 de Nueva York y cada 10 min hasta las 15:58, días hábiles.
# El cron de GitHub va en UTC y se atrasa en horas punta: hay 4 disparos de
# respaldo que cubren horario de verano e invierno. El script sale solo si es
# muy temprano o si la ventana ya cerró, y la concurrencia evita dos loops a la vez.
on:
  schedule:
    - cron: "6 13 * * 1-5"
    - cron: "21 13 * * 1-5"
    - cron: "6 14 * * 1-5"
    - cron: "21 14 * * 1-5"
  workflow_dispatch:
    inputs:
      modo:
        description: "ventana | una_vez"
        default: "una_vez"

concurrency:
  # una_vez (foto de respaldo) no espera detrás del loop de todo el día
  group: ventana-${{ inputs.modo || 'ventana' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # para lanzar la etapa siguiente (lib/encadenar.py)

jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GitHub corta a las 6 h: screener.py se relanza solo a las 5 h 20 min
    env:
      GH_TOKEN: ${{ github.token }}
      DATOS: ${{ github.workspace }}/datos
      SEC_CONTACTO: ${{ secrets.SEC_CONTACTO }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: .github/actions-datos.sh
      - name: Fotos
        run: python screener.py ${{ inputs.modo || 'ventana' }}

  # Acciones grandes: solo recolección, en un trabajo aparte (si falla, las fotos siguen).
  grandes:
    uses: ./.github/workflows/grandes.yml
    with:
      modo: ${{ inputs.modo || 'ventana' }}
